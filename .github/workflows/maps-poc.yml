name: Build and deploy maps-poc

on:
  push:
    branches: [main]
    paths:
      - 'poc/maps/**'
      - 'maps-poc/**'
      - '.github/workflows/maps-poc.yml'
  pull_request:
    paths:
      - 'poc/maps/**'
      - 'maps-poc/**'
      - '.github/workflows/maps-poc.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: maps-poc-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: poc/maps/package-lock.json

      - name: Install dependencies
        working-directory: poc/maps
        run: npm ci

      - name: Build maps-poc
        working-directory: poc/maps
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_RESOLVE_API_BASE: ${{ secrets.VITE_RESOLVE_API_BASE }}
        run: npm run build

      - name: Verify build output
        run: test -f maps-poc/index.html

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: poc/maps/package-lock.json

      - name: Install dependencies
        working-directory: poc/maps
        run: npm ci

      - name: Build maps-poc
        working-directory: poc/maps
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_RESOLVE_API_BASE: ${{ secrets.VITE_RESOLVE_API_BASE }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
